apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: spotify-filter
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      istio: ingress
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                local share_token = "hyun"

                local allowed_hosts = {
                  ["spotify.lth.so"] = true,
                  ["spotify.limtaehyun.dev"] = true,
                }

                local shared_pages = {
                  [""] = true,
                  ["/recent"] = true,
                  ["/stats"] = true,
                  ["/longest-session"] = true,
                  ["/now-playing"] = true,
                  ["/top/songs"] = true,
                  ["/top/albums"] = true,
                  ["/top/artists"] = true,
                }

                function envoy_on_request(handle)
                  local headers = handle:headers()
                  local authority = headers:get(":authority")
                  if not authority then
                    return
                  end

                  local host = string.lower(authority):match("^([^:]+)")
                  if not allowed_hosts[host] then
                    return
                  end

                  local method = headers:get(":method")
                  if method ~= "GET" and method ~= "HEAD" then
                    return
                  end

                  -- A nonempty login cookie bypasses the guest redirect.
                  local cookie = headers:get("cookie") or ""
                  for part in cookie:gmatch("[^;]+") do
                    local name, value =
                      part:match("^%s*([^=%s]+)=([^;]*)")

                    if name == "token" and value:match("%S") then
                      return
                    end
                  end

                  local path = headers:get(":path")
                  if not path then
                    return
                  end

                  local path_only, query = path:match("^([^?]*)(.*)$")
                  local page = path_only:gsub("/+$", "")

                  local is_detail =
                    page:match("^/songs/[^/]+$") or
                    page:match("^/albums/[^/]+$") or
                    page:match("^/artists/[^/]+$")

                  -- Leave API, OAuth, assets and existing share paths unchanged.
                  if not shared_pages[page] and not is_detail then
                    return
                  end

                  handle:respond({
                    [":status"] = "302",
                    ["location"] = "/share/" .. share_token .. page .. query,
                    ["cache-control"] = "no-store",
                  }, "")
                end
