apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: fallback-lth-redirect
  namespace: istio-ingress
spec:
  hosts:
    - "*.lth.so"
  gateways:
    - public-gateway
  http:
    - redirect:
        authority: lth.so
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: blue-house-redirect
  namespace: istio-ingress
spec:
  hosts:
    - "xn--vk1b187a8ue.xyz"
  gateways:
    - public-gateway
  http:
    - redirect:
        authority: lth.so
        scheme: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blue-house-http-redirect
spec:
  parentRefs:
    - name: blue-house-http
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - xn--vk1b187a8ue.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: lth.so
            statusCode: 301
