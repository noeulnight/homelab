apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@limtaehyun.dev
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - limtaehyun.dev
            - lth.so
      - http01:
          gatewayHTTPRoute:
            serviceType: ClusterIP
            parentRefs:
              - name: blue-house-http
                group: gateway.networking.k8s.io
                namespace: istio-ingress
                kind: Gateway
        selector:
          dnsNames:
            - xn--vk1b187a8ue.xyz
