apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: toolhive
spec:
  hosts:
    - mcp.lth.so
  gateways:
    - istio-ingress/public-gateway
  http:
    # Keep the public endpoint closed until client authentication is configured.
    - directResponse:
        status: 403
        body:
          string: '{"error":"access_not_configured"}'
      headers:
        response:
          set:
            content-type: application/json
