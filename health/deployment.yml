apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
  labels:
    app.kubernetes.io/version: v1
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: health-api
  template:
    metadata:
      labels:
        app: health-api
        app.kubernetes.io/version: v1
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data-permissions
          image: busybox:1.37
          command: ["chown", "10001:10001", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: health-api
          image: ghcr.io/noeulnight/health-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: HEALTH_DB_PATH
              value: /data/health.db
          envFrom:
            - secretRef:
                name: health-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: health-pvc
