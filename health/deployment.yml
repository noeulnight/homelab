apiVersion: apps/v1
kind: Deployment
metadata:
  name: health
  labels:
    app.kubernetes.io/version: v1
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: health
  template:
    metadata:
      labels:
        app: health
        app.kubernetes.io/version: v1
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data-permissions
          image: busybox:1.37
          command: ["chown", "10001:10001", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: health
          image: ghcr.io/noeulnight/health-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: HEALTH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: HEALTH_API_TOKEN
            - name: HEALTH_DB_PATH
              value: /data/health.db
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: health-pvc
