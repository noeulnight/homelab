apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ntfy
  namespace: prometheus
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - ntfy
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
