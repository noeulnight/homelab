apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contextforge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: contextforge
    server: https://kubernetes.default.svc
  project: default
  source:
    path: platform/contextforge
    repoURL: git@github.com:noeulnight/homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
