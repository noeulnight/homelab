apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toolhive-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: toolhive-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: oci://ghcr.io/stacklok/toolhive/toolhive-operator
    targetRevision: 0.66.0
    helm:
      releaseName: toolhive-operator
      valuesObject:
        operator:
          features:
            storageVersionMigrator: false
          rbac:
            scope: namespace
            allowedNamespaces:
              - toolhive-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
