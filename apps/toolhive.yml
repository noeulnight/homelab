apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toolhive
  namespace: argocd
spec:
  destination:
    namespace: toolhive-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: platform/toolhive
    repoURL: git@github.com:noeulnight/homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
