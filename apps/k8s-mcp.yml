apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  sources:
    - chart: kubernetes-mcp-server
      repoURL: oci://ghcr.io/containers/charts/kubernetes-mcp-server
      targetRevision: "0.1.1"
      helm:
        releaseName: mcp
        values: |
          ingress:
            enabled: false
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          rbac:
            extraClusterRoleBindings:
              - name: use-view-role
                roleRef:
                  name: view
                  external: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
