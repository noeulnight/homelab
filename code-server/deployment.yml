apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data-permissions
          image: busybox:1.37
          command: ["chown", "1000:1000", "/home/coder"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /home/coder
        - name: install-texlive
          image: debian:bookworm-slim
          command: ["/bin/sh", "-c"]
          args:
            - (test -x /home/coder/.TinyTeX/bin/aarch64-linux/pdflatex || (apt-get update && apt-get install -y --no-install-recommends ca-certificates curl perl xz-utils && curl -fsSL https://yihui.org/tinytex/install-bin-unix.sh | sh)) && chown -R 1000:1000 /home/coder/.TinyTeX
          env:
            - name: HOME
              value: /home/coder
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /home/coder
      containers:
        - name: code-server
          image: ghcr.io/coder/code-server:latest
          args:
            - --auth
            - none
            - --bind-addr
            - 0.0.0.0:8080
            - /home/coder/workspace
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NPM_CONFIG_PREFIX
              value: /home/coder/.local
            - name: PATH
              value: /home/coder/.TinyTeX/bin/aarch64-linux:/home/coder/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: data
              mountPath: /home/coder
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: code-server-pvc
