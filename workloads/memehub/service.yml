---
apiVersion: v1
kind: Service
metadata:
  name: memehub-api
spec:
  selector:
    app: memehub-api
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: memehub-web
spec:
  selector:
    app: memehub-web
  ports:
  - name: http
    port: 80
    targetPort: http
