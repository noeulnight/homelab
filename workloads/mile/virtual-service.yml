apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mile
spec:
  hosts:
    - mile.lth.so
  gateways:
    - istio-ingress/public-gateway
  http:
    - route:
        - destination:
            host: mile-service.mile.svc.cluster.local
            port:
              number: 8000
