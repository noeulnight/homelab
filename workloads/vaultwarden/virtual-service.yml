apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vaultwarden
spec:
  hosts:
    - vault.lth.so
  gateways:
    - istio-ingress/public-gateway
  http:
    - route:
        - destination:
            host: vaultwarden-service.vaultwarden.svc.cluster.local
            port:
              number: 80
      headers:
        response:
          set:
            Strict-Transport-Security: max-age=31536000; includeSubDomains
