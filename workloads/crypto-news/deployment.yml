apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-news
spec:
  revisionHistoryLimit: 0
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crypto-news
  template:
    metadata:
      labels:
        app: crypto-news
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data-permissions
          image: busybox:1.37
          command: ["chown", "10001:10001", "/app/data"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: crypto-news
          image: ghcr.io/whoisdreamer/crypto-news:sha-764d339
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crypto-news-pvc
