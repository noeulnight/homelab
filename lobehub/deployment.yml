apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobehub
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: lobehub
  template:
    metadata:
      labels:
        app: lobehub
    spec:
      initContainers:
        - name: install-gateway
          image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - |
              wget -q https://github.com/lobehub/lobehub-gateway/releases/download/0.3.1/gateway-linux-arm64 -O /gateway/gateway
              echo '5fea4b844e95b49a582c9f2e504f5a94b22e84f2aa94f6d76fe9c78799ff190c  /gateway/gateway' | sha256sum -c -
              chmod 0555 /gateway/gateway
          volumeMounts:
            - name: gateway-bin
              mountPath: /gateway
      containers:
        - name: lobehub
          image: lobehub/lobehub@sha256:963a8349cbd4d95953f296f930ef6b3bdddb38cabbf64fe74742549bc76b62ae
          ports:
            - name: http
              containerPort: 3210
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@lobehub-postgres:5432/lobehub
            - name: APP_URL
              value: https://lobe.lth.so
            - name: INTERNAL_APP_URL
              value: http://localhost:3210
            - name: KEY_VAULTS_SECRET
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: KEY_VAULTS_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: AUTH_SECRET
            - name: JWKS_KEY
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: JWKS_KEY
            - name: AUTH_SSO_PROVIDERS
              value: authentik
            - name: AUTH_DISABLE_EMAIL_PASSWORD
              value: "1"
            - name: AUTH_AUTHENTIK_ID
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: AUTH_AUTHENTIK_ID
            - name: AUTH_AUTHENTIK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: AUTH_AUTHENTIK_SECRET
            - name: AUTH_AUTHENTIK_ISSUER
              value: https://auth.lth.so/application/o/lobehub/
            - name: S3_ENDPOINT
              value: https://s3.lth.so
            - name: S3_BUCKET
              value: lobe
            - name: S3_ENABLE_PATH_STYLE
              value: "1"
            - name: S3_SET_ACL
              value: "0"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: REDIS_URL
              value: redis://redis-service.redis.svc.cluster.local:6379
            - name: REDIS_PREFIX
              value: lobehub
            - name: REDIS_TLS
              value: "0"
            - name: LLM_VISION_IMAGE_USE_BASE64
              value: "1"
            - name: ENABLE_AGENT_GATEWAY
              value: "1"
            - name: AGENT_GATEWAY_URL
              value: https://gateway.lth.so
            - name: AGENT_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: GATEWAY_SERVICE_TOKEN
            - name: DEVICE_GATEWAY_URL
              value: https://device-gateway.lth.so
            - name: DEVICE_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: GATEWAY_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
        - name: gateway
          image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: ["/gateway/gateway"]
          ports:
            - name: agent-gateway
              containerPort: 8787
            - name: device-gateway
              containerPort: 8788
          env:
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: GATEWAY_SERVICE_TOKEN
            - name: JWKS_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: JWKS_PUBLIC_KEY
            - name: LOBE_API_BASE_URL
              value: http://localhost:3210
          readinessProbe:
            httpGet:
              path: /health
              port: agent-gateway
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: agent-gateway
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: gateway-bin
              mountPath: /gateway
              readOnly: true
      volumes:
        - name: gateway-bin
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobehub-postgres
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: lobehub-postgres
  template:
    metadata:
      labels:
        app: lobehub-postgres
    spec:
      containers:
        - name: postgres
          image: paradedb/paradedb@sha256:6a334b612cadfeb92c416ecf3816dd9a277c10976e2e931e2c33f7289867c7c9
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_search
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lobehub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lobehub-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "lobehub"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "lobehub"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lobehub-postgres-pvc
